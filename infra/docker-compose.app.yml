services:
  dispatch-slip-analyzer:
    build:
      context: ../dispatch-slip-analyzer
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      infra_net:
        aliases:
          - dispatch-slip-analyzer
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${DISPATCH_SCAN_ANALYZER_PORT:-8091}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ../agape-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      dispatch-slip-analyzer:
        condition: service_healthy
    networks:
      infra_net:
        aliases:
          - api
    environment:
      QUARKUS_HTTP_PORT: ${QUARKUS_HTTP_PORT}
      QUARKUS_HTTP_HOST: 0.0.0.0

      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}

      # Oracle datasource
      QUARKUS_FLYWAY_ORACLE_REPAIR_AT_START: "true"
      QUARKUS_DATASOURCE_ORACLE_DB_KIND: oracle
      QUARKUS_DATASOURCE_ORACLE_USERNAME: ${QUARKUS_DATASOURCE_ORACLE_USERNAME}
      QUARKUS_DATASOURCE_ORACLE_PASSWORD: ${QUARKUS_DATASOURCE_ORACLE_PASSWORD}
      QUARKUS_DATASOURCE_ORACLE_JDBC_URL: ${QUARKUS_DATASOURCE_ORACLE_JDBC_URL}

      # Postgres datasource
      QUARKUS_DATASOURCE_POSTGRES_DB_KIND: postgresql
      QUARKUS_DATASOURCE_POSTGRES_USERNAME: ${QUARKUS_DATASOURCE_POSTGRES_USERNAME}
      QUARKUS_DATASOURCE_POSTGRES_PASSWORD: ${QUARKUS_DATASOURCE_POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_POSTGRES_JDBC_URL: ${QUARKUS_DATASOURCE_POSTGRES_JDBC_URL}

      # Flyway
      QUARKUS_FLYWAY_POSTGRES_MIGRATE_AT_START: ${QUARKUS_FLYWAY_POSTGRES_MIGRATE_AT_START}
      QUARKUS_FLYWAY_POSTGRES_LOCATIONS: ${QUARKUS_FLYWAY_POSTGRES_LOCATIONS}

      # JWT / auth
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_EXPIRATION_IN_SECONDS: ${AUTH_JWT_EXPIRATION_IN_SECONDS}
      AUTH_JWT_DEFAULT_ROLE_NAME: ${AUTH_JWT_DEFAULT_ROLE_NAME}
      MP_JWT_VERIFY_ISSUER: ${MP_JWT_VERIFY_ISSUER}

      SMALLRYE_JWT_SIGN_KEY_LOCATION: file:/keys/privateKey.pem
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:/keys/publicKey.pem

      # CORS
      FRONTEND_URL: ${FRONTEND_URL}

      # Dispatch slip analyzer
      DISPATCH_SCAN_ANALYZER_URL: ${DISPATCH_SCAN_ANALYZER_URL}

    volumes:
      - ./oracle/migrations:/migrations/oracle:ro
      - ./postgres/migrations:/migrations/postgres:ro
      - ./keys:/keys:ro

    ports:
      - "0.0.0.0:${QUARKUS_HTTP_PORT}:${QUARKUS_HTTP_PORT}"

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${QUARKUS_HTTP_PORT}/q/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  infra_net:
    external: true
    name: infra_default