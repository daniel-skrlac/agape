# --- Oracle datasource ---
quarkus.datasource.oracle.db-kind=oracle
quarkus.datasource.oracle.username=${QUARKUS_DATASOURCE_ORACLE_USERNAME:IN_WPRG}
quarkus.datasource.oracle.password=${QUARKUS_DATASOURCE_ORACLE_PASSWORD:in_wprg}
quarkus.datasource.oracle.jdbc.url=${QUARKUS_DATASOURCE_ORACLE_JDBC_URL:jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1}
# --- Postgres datasource ---
quarkus.datasource.postgres.db-kind=postgresql
quarkus.hibernate-orm.datasource=postgres
quarkus.flyway.postgres.migrate-at-start=${QUARKUS_FLYWAY_POSTGRES_MIGRATE_AT_START:true}
quarkus.flyway.postgres.locations=${QUARKUS_FLYWAY_POSTGRES_LOCATIONS:filesystem:/migrations/postgres}
# --- JWT / AUTH CONFIG ---
auth.jwt.issuer=agape-api
auth.jwt.expiration-in-seconds=86400
auth.jwt.default-role-name=USER
smallrye.jwt.sign.key.location=file:../infra/keys/privateKey.pem
mp.jwt.verify.publickey.location=file:../infra/keys/publicKey.pem
mp.jwt.verify.issuer=${auth.jwt.issuer}
# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_URL:http://localhost:8081}
quarkus.http.cors.headers=origin,accept,content-type,authorization,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.auth.permission.preflight.paths=/*
quarkus.http.auth.permission.preflight.methods=OPTIONS
quarkus.http.auth.permission.preflight.policy=permit
quarkus.http.auth.permission.public.paths=/api/v1/auth/*
quarkus.http.auth.permission.public.methods=POST,OPTIONS
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# --- Dispatch / MK booking/cancel flags ---
dispatch.mk.knjiziti-na-skladiste=${DISPATCH_MK_KNJIZITI_NA_SKLADISTE:1}
dispatch.mk.knjiziti-uk-popisa=${DISPATCH_MK_KNJIZITI_UK_POPISA:0}
dispatch.mk.knjiziti-normative=${DISPATCH_MK_KNJIZITI_NORMATIVE:0}
dispatch.mk.generiraj-zapisnik=${DISPATCH_MK_GENERIRAJ_ZAPISNIK:0}
dispatch.mk.azuriraj-prodajne=${DISPATCH_MK_AZURIRAJ_PRODAJNE:0}
dispatch.mk.azuriraj-nabavne=${DISPATCH_MK_AZURIRAJ_NABAVNE:1}
dispatch.mk-storno.na-skladiste=${DISPATCH_MK_STORNO_NA_SKLADISTE:1}
dispatch.mk-storno.uk-popisa=${DISPATCH_MK_STORNO_UK_POPISA:0}
dispatch.mk-storno.veznid=${DISPATCH_MK_STORNO_VEZNID:1}
dispatch.mk-storno.postavi-oznaku=${DISPATCH_MK_STORNO_POSTAVI_OZNAKU:1}

